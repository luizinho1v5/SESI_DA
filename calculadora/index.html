<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora JavaScript</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculadora">

        <h2>Calculadora</h2>

        <div class="campos">
            <input id="campo1" type="number" placeholder="Primeiro valor">
            <input id="campo2" type="number" placeholder="Segundo valor">
        </div>

        <div class="botoes">
            <button onclick="somaDeDoisValores()">+</button>
            <button onclick="subtrairDoisValores()">−</button>
            <button onclick="multiplicarDoisValores()">×</button>
            <button onclick="dividirDoisValores()">÷</button>
        </div>

        <h1>Resultado: 0</h1>

    </div>

    <script src="index.js"></script>

</body>

</html>
